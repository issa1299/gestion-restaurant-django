{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compte créé - RestaurantPro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: #f3f4f6; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card { background: #fff; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); width: 100%; max-width: 460px; padding: 44px 36px; text-align: center; }
        .icon { font-size: 3rem; color: #22c55e; margin-bottom: 14px; }
        h1 { font-size: 1.4rem; font-weight: 700; color: #1f2937; }
        p { color: #6b7280; font-size: 0.9rem; margin-top: 10px; line-height: 1.6; }
        a.btn { display: inline-block; margin-top: 24px; padding: 12px 28px; background: #f97316; color: #fff; font-weight: 700; border-radius: 8px; text-decoration: none; }
        a.btn:hover { background: #ea580c; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon"><i class="fa-solid fa-circle-check"></i></div>
        <h1>Votre établissement « {{ restaurant_nom }} » a été créé</h1>
        <p>
            Il est actuellement <strong>en attente d'activation</strong> par notre équipe.
            Dès validation, vous pourrez vous connecter avec votre identifiant.
        </p>
        <a class="btn" href="{% url 'accounts:login' %}">Aller à la connexion</a>
    </div>
</body>
</html>
