{% extends "base/base.html" %}

{% block content %}

<div class="max-w-lg mx-auto mt-16">

    <div class="bg-white rounded-2xl shadow-lg p-8">

        <div class="text-center">

            <div class="w-20 h-20 mx-auto rounded-full bg-red-100 flex items-center justify-center">

                <i class="fas fa-trash-alt text-4xl text-red-600"></i>

            </div>

            <h2 class="text-2xl font-bold mt-5 text-gray-800">
                Supprimer le client
            </h2>

            <p class="text-gray-600 mt-4">

                Voulez-vous vraiment supprimer le client

                <span class="font-bold text-red-600">
                    {{ client.nom }}
                </span>

                ?

            </p>

            <p class="text-sm text-gray-400 mt-2">

                Cette action est irréversible.

            </p>

        </div>

        <form method="POST" class="mt-8">

            {% csrf_token %}

            <div class="flex justify-center gap-4">

                <a href="{% url 'clients:list' %}"
                   class="px-6 py-3 rounded-xl bg-gray-200 hover:bg-gray-300">

                    <i class="fas fa-times"></i>

                    Annuler

                </a>

                <button
                    class="px-6 py-3 rounded-xl bg-red-600 hover:bg-red-700 text-white">

                    <i class="fas fa-trash"></i>

                    Oui, supprimer

                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
