{% extends "base/base.html" %}
{% block title %}{{ action }} une table — RestaurantPro{% endblock %}

{% block content %}
<div class="p-6 max-w-lg mx-auto">

    <div class="flex items-center gap-3 mb-8">
        <a href="{% url 'tables:liste' %}"
           class="w-10 h-10 flex items-center justify-center rounded-xl bg-white shadow hover:bg-gray-50 transition text-gray-600">
            <i class="fas fa-arrow-left"></i>
        </a>
        <h1 class="text-2xl font-bold text-slate-800">
            <i class="fas fa-chair text-orange-500 mr-2"></i>{{ action }} une table
        </h1>
    </div>

    <div class="bg-white rounded-2xl shadow-md p-8">

        <form method="POST" class="space-y-6">
            {% csrf_token %}

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Numéro de la table <span class="text-red-500">*</span></label>
                <input type="number" name="numero" value="{{ table.numero|default:'' }}" required min="1"
                       class="w-full rounded-xl border-2 border-gray-200 p-3 focus:border-orange-500 focus:outline-none text-lg font-bold text-center"
                       placeholder="Ex : 1">
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Capacité (personnes) <span class="text-red-500">*</span></label>
                <div class="flex items-center">
                    <button type="button" onclick="document.getElementById('cap').stepDown()"
                            class="bg-gray-200 hover:bg-gray-300 text-gray-700 w-12 h-12 rounded-l-xl font-bold text-xl transition">
                        -
                    </button>
                    <input type="number" id="cap" name="capacite" value="{{ table.capacite|default:4 }}" required min="1"
                           class="flex-1 border-y-2 border-gray-200 h-12 focus:outline-none text-center text-lg font-bold pointer-events-none">
                    <button type="button" onclick="document.getElementById('cap').stepUp()"
                            class="bg-gray-200 hover:bg-gray-300 text-gray-700 w-12 h-12 rounded-r-xl font-bold text-xl transition">
                        +
                    </button>
                </div>
            </div>

            <div class="flex gap-4 pt-4 border-t">
                <a href="{% url 'tables:liste' %}"
                   class="flex-1 text-center bg-gray-200 hover:bg-gray-300 py-3 rounded-xl font-semibold transition">
                    Annuler
                </a>
                <button type="submit"
                        class="flex-1 bg-orange-500 hover:bg-orange-600 text-white py-3 rounded-xl font-bold transition shadow-md">
                    <i class="fas fa-save mr-2"></i>Enregistrer
                </button>
            </div>

        </form>

    </div>

</div>
{% endblock %}
