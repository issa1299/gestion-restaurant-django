{% if messages %}

<div id="toast-container"
     class="fixed top-5 right-5 z-50 space-y-3">

    {% for message in messages %}

    <div class="toast flex items-center gap-4 px-5 py-4 rounded-xl shadow-xl text-white

        {% if message.tags == 'success' %}
            bg-green-600
        {% elif message.tags == 'error' %}
            bg-red-600
        {% elif message.tags == 'warning' %}
            bg-yellow-500
        {% else %}
            bg-blue-600
        {% endif %}
    ">

        {% if message.tags == 'success' %}
            <i class="fas fa-circle-check text-2xl"></i>

        {% elif message.tags == 'error' %}
            <i class="fas fa-circle-xmark text-2xl"></i>

        {% elif message.tags == 'warning' %}
            <i class="fas fa-triangle-exclamation text-2xl"></i>

        {% else %}
            <i class="fas fa-circle-info text-2xl"></i>

        {% endif %}

        <span>{{ message }}</span>

    </div>

    {% endfor %}

</div>

{% endif %}
