{% extends "base/base.html" %}
{% block title %}Modifier la livraison N° {{ livraison.id }}{% endblock %}

{% block content %}
<div class="p-3 sm:p-6 max-w-2xl mx-auto">
    <div class="mb-6 flex items-center gap-3">
        <a href="{% url 'livraison:detail' livraison.id %}"
           class="w-9 h-9 sm:w-10 sm:h-10 flex items-center justify-center rounded-xl bg-white shadow hover:bg-gray-50 transition text-gray-600 shrink-0">
            <i class="fas fa-arrow-left text-sm"></i>
        </a>
        <h1 class="text-xl sm:text-2xl font-bold text-slate-800">
            <i class="fas fa-pen text-orange-500 mr-2"></i>Modifier la livraison N° {{ livraison.id }}
        </h1>
    </div>

    <div class="bg-white rounded-xl sm:rounded-2xl shadow-md overflow-hidden">
        <form method="POST" class="p-5 sm:p-8 space-y-5">
            {% csrf_token %}

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">
                    <i class="fas fa-map-pin text-orange-500 mr-1"></i>Adresse de livraison
                </label>
                <textarea name="adresse" rows="2"
                          class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-orange-500 focus:border-orange-500 transition">{{ livraison.adresse }}</textarea>
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">
                    <i class="fas fa-phone text-orange-500 mr-1"></i>Téléphone
                </label>
                <input type="text" name="telephone" value="{{ livraison.telephone }}"
                       class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-orange-500 focus:border-orange-500 transition">
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">
                    <i class="fas fa-user text-orange-500 mr-1"></i>Livreur
                </label>
                <select name="livreur"
                        class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-orange-500 focus:border-orange-500 transition">
                    <option value="">-- Aucun livreur --</option>
                    {% for livreur in livreurs %}
                    <option value="{{ livreur.id }}" {% if livraison.livreur and livraison.livreur.id == livreur.id %}selected{% endif %}>
                        {{ livreur.get_full_name|default:livreur.username }} ({{ livreur.username }})
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">
                    <i class="fas fa-sticky-note text-orange-500 mr-1"></i>Notes
                </label>
                <textarea name="notes" rows="3"
                          class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-orange-500 focus:border-orange-500 transition">{{ livraison.notes }}</textarea>
            </div>

            <div class="flex gap-3 pt-4 border-t">
                <button type="submit"
                        class="flex-1 bg-orange-500 hover:bg-orange-600 text-white font-semibold py-3 rounded-xl transition">
                    <i class="fas fa-save mr-2"></i>Enregistrer
                </button>
                <a href="{% url 'livraison:detail' livraison.id %}"
                   class="px-6 py-3 border border-slate-300 text-slate-700 font-semibold rounded-xl hover:bg-slate-50 transition">
                    Annuler
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
